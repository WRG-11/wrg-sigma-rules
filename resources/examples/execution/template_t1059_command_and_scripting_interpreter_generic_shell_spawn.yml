title: Template -- Command and Scripting Interpreter (generic shell spawn)
id: f838962e-3d75-5544-a99a-5b84ac31d935
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1059 (Command and Scripting Interpreter (generic shell spawn)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1059/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_shell_spawn:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \wscript.exe
    - \cscript.exe
    CommandLine|contains:
    - Invoke-
    - DownloadString
    - FromBase64String
  condition: selection_shell_spawn
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
level: medium
tags:
- attack.t1059
- wrg.template
- wrg.tactic.execution
