date: '2026-08-19'
logsource:
  category: process_creation
  product: windows
detection:
  selection_downloaded_file:
    Image|contains:
    - \Downloads\
    - \Temp\Temporary Internet Files\
    Image|endswith:
    - .exe
    - .msi
    - .scr
    - .bat
    - .vbs
  selection_browser_or_mail_parent:
    ParentImage|endswith:
    - \chrome.exe
    - \msedge.exe
    - \firefox.exe
    - \outlook.exe
    - \explorer.exe
  condition: selection_downloaded_file and selection_browser_or_mail_parent
falsepositives:
- A user opening a legitimate ZIP/LNK attachment or download link sent by IT (e.g.
  a scripted deployment package) that the browser or mail client then executes
