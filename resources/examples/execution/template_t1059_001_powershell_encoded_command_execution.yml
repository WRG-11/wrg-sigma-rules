title: Template -- PowerShell Encoded Command Execution
id: 43e1c806-e80d-5489-bc06-3620cb6bf257
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1059.001 (PowerShell Encoded Command Execution). Synthetic
  exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1059/001/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_pwsh_encoded:
    Image|endswith: \powershell.exe
    CommandLine|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -e '
  # Filter add — sister to observed_alphv_t1059_001
  # (cross-corpus backport). Legit SCCM / installer / management-context
  # PowerShell uses the `-NoProfile -EncodedCommand <short payload>`
  # combination for system-context execution; the selection_*
  # block above previously fired on this benign pattern (prior
  # false-positive finding). Same tradeoff as the T1027 sister: adversaries
  # appending `-NoProfile` to bare encoded PS would evade this filter;
  # Phase 2 candidate is to add an entropy / length qualifier to the
  # payload (sister T1027 has the long_base64_blob selection; this
  # template does not, so the filter is the primary tradeoff knob).
  filter_legit_sccm_installer_encoded_ps:
    CommandLine|contains: ' -NoProfile -EncodedCommand '
  condition: selection_pwsh_encoded and not filter_legit_sccm_installer_encoded_ps
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
level: medium
tags:
- attack.t1059.001
- wrg.template
- wrg.tactic.execution
