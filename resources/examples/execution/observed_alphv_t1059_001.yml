title: ALPHV/BlackCat -- T1059.001
id: 9aa6d2c4-4cf6-5cdd-8618-724ded1815de
status: test
description: Breach intel signature for actor alphv, MITRE technique T1059.001. Derived from 1 observed incident(s) in the
  WRG breach catalog.
references:
- https://attack.mitre.org/techniques/T1059/001/
- https://attack.mitre.org/groups/G1015/
- https://example.test/mgm
author: WinstonRedGuard -- sigma plugin observed rules (derived from breach corpus)
date: '2023-09-10'
logsource:
  category: process_creation
  product: windows
detection:
  selection_pwsh_encoded:
    Image|endswith: \powershell.exe
    CommandLine|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -e '
  # R89-54b backport of R89-33b cycle-1 FP-fix (golden fixture
  # apps/wrg_threat_intel/tests/fixtures/sigma/alphv_t1059_001_golden.yml).
  # Sister to the filter on observed_alphv_t1027_obfuscation: the same
  # legit_encoded_ps_sccm benign event tripped both rules (T1027 from the
  # obfuscated-payload side, T1059.001 from the powershell.exe Image side).
  # Filter is duplicated per-rule rather than shared because Sigma does
  # not have a portable shared-helper construct; each rule must
  # self-contain its detection logic for downstream SIEM deploy
  # portability. See V R89-54v done report for the cycle-2 corpus-
  # publication-gap finding that triggered this backport.
  filter_legit_sccm_installer_encoded_ps:
    CommandLine|contains: ' -NoProfile -EncodedCommand '
  condition: selection_pwsh_encoded and not filter_legit_sccm_installer_encoded_ps
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
level: high
tags:
- attack.t1059.001
- wrg.observed.actor.alphv
- wrg.severity.high
- wrg.observed
- wrg.tactic.execution
