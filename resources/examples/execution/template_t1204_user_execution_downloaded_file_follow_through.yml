title: Template -- User Execution (downloaded-file follow-through)
id: 682df058-4191-5746-b355-b0e8bfccde5a
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1204 (User Execution (downloaded-file follow-through)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1204/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_downloaded_file:
    Image|contains:
    - \Downloads\
    - \Temp\Temporary Internet Files\
    Image|endswith:
    - .exe
    - .msi
    - .scr
    - .bat
    - .vbs
  selection_browser_or_mail_parent:
    ParentImage|endswith:
    - \chrome.exe
    - \msedge.exe
    - \firefox.exe
    - \outlook.exe
    - \explorer.exe
  condition: selection_downloaded_file and selection_browser_or_mail_parent
falsepositives:
- Ordinary software installation, where a user downloads an installer in the browser and runs it from Explorer -- the exact parent-child pair this rule matches
- explorer.exe as the parent, which covers anything launched from a File Explorer window or the desktop and is by far the widest of the five parents; narrow it first
- Portable applications that users keep in Downloads and launch repeatedly instead of installing
level: medium
tags:
- attack.t1204
- wrg.template
- wrg.tactic.execution
