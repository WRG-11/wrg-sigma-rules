title: Template -- Network Denial of Service (DDoS mitigation event)
id: 8394c08c-046d-4a5d-a642-d10a9bc5adbd
status: test
description: Detect a DDoS mitigation action recorded by a network security control. This is a canonical telemetry pattern, not an attribution claim.
references:
- https://attack.mitre.org/techniques/T1498/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-09-10'
logsource:
  category: firewall
detection:
  selection_mitigation:
    Action|contains: DDoS
    Disposition|contains: blocked
  condition: selection_mitigation
falsepositives:
- An administrator deliberately enables a DDoS simulation or mitigation drill against a test service
- A protection provider blocks a flash-crowd event whose traffic resembles an attack
level: high
tags:
- attack.t1498
- wrg.template
- wrg.tactic.impact
