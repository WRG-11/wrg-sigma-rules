title: Template -- Inhibit System Recovery (vssadmin shadow copy delete)
id: 977c50e2-39a8-5ea9-bc63-693dd6bc7f9d
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1490 (Inhibit System Recovery (vssadmin shadow copy delete)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1490/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_vss_delete:
    Image|endswith:
    - \vssadmin.exe
    - \wmic.exe
    - \wbadmin.exe
    CommandLine|contains:
    - delete shadows
    - shadowcopy delete
    - delete catalog
  condition: selection_vss_delete
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
level: medium
tags:
- attack.t1490
- wrg.template
- wrg.tactic.impact
