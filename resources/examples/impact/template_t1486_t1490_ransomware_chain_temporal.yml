title: Template -- Ransomware execution chain -- shadow copy deletion (base)
name: t1490_shadow_copy_deletion_base
id: 331ca6e3-720a-5896-bf12-0f3d70e68bd9
status: experimental
description: Base event match for the ransomware-chain correlation below -- shadow
  copy deletion alone is noisy (backup software and imaging tools do it legitimately)
  and is not the alert on its own.
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-07-29'
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin:
    Image|endswith:
    - \vssadmin.exe
    - \wmic.exe
    CommandLine|contains|all:
    - delete
    - shadow
  selection_wbadmin:
    Image|endswith: \wbadmin.exe
    CommandLine|contains: 'delete catalog'
  condition: selection_vssadmin or selection_wbadmin
level: informational
tags:
- attack.t1490
