title: Template -- Data Destruction (secure-wipe tooling / mass deletion)
id: 17edffc9-99d1-59e6-b924-0d99e432a294
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1485 (Data Destruction (secure-wipe tooling / mass deletion)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1485/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_secure_delete_tool:
    Image|endswith:
    - \sdelete.exe
    - \sdelete64.exe
  selection_mass_delete_command:
    CommandLine|contains:
    - del /f /s /q
    - rm -rf /
    - 'format c:'
  condition: 1 of selection_*
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
level: medium
tags:
- attack.t1485
- wrg.template
- wrg.tactic.impact
