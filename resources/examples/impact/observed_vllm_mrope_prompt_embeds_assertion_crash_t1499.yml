title: vLLM completions -- T1499 pure prompt-embeds payload with M-RoPE model fatally crashes EngineCore
id: eb420530-eeed-4b45-a302-97b0bbd67a5b
status: experimental
description: |
  Vendor-disclosed detection for CVE-2026-55514 (GHSA-33cg-gxv8-3p8g,
  CVSS 7.1 HIGH), affecting vLLM from 0.12.0 before 0.24.0.

  Sending a pure prompt-embeds payload in a `/v1/completions` request,
  against a model configured to use M-RoPE (multimodal rotary position
  embeddings), causes `EngineCore` to fail an internal assertion and
  FATALLY CRASH -- shutting down the entire server process, not just the
  offending request. Unlike vLLM's typical request-level error handling,
  this specific combination reaches an unrecoverable assertion failure at
  the engine level. Any remote user merely AUTHORIZED to make a normal
  `/v1/completions` request (no special privilege needed beyond ordinary
  API access) can induce the crash and take down the service for every
  other user.

  Detection logic flags a `/v1/completions` request carrying a
  prompt-embeds payload with no accompanying text prompt (the "pure"
  shape the advisory specifies) directed at a model configured for
  M-RoPE -- the exact combination that reaches the unguarded assertion.

  Aggregated from 1 first-party vendor security advisory (vllm-project,
  via GHSA and NVD, citing the exact fix commit, PR, and release),
  fixed in 0.24.0.
references:
- https://github.com/vllm-project/vllm/security/advisories/GHSA-33cg-gxv8-3p8g
- https://github.com/vllm-project/vllm/commit/470229c37efaf69c86e8bc97482b0b1ff7551c65
- https://github.com/vllm-project/vllm/pull/45252
- https://attack.mitre.org/techniques/T1499/
author: WinstonRedGuard -- sigma plugin observed rules (derived from breach corpus)
date: '2026-08-11'
logsource:
  category: webserver
  product: ""
detection:
  selection_completions_endpoint:
    cs-uri-stem|contains: /v1/completions
  selection_prompt_embeds_no_prompt:
    cs-body|contains: prompt_embeds
  filter_has_text_prompt:
    cs-body|contains: '"prompt":"'
  condition: selection_completions_endpoint and selection_prompt_embeds_no_prompt and not filter_has_text_prompt
falsepositives:
- A deployment already upgraded to 0.24.0+, where this request shape is
  handled without crashing `EngineCore` -- a matching request on a fixed
  deployment returns an ordinary response or a clean error, not a server
  crash
- A deployment not serving any M-RoPE-configured model -- this
  vulnerability is unreachable regardless of the request shape submitted
- A legitimate prompt-embeds-only request against a non-M-RoPE model,
  which is the SUPPORTED use case this feature exists for -- this rule
  cannot distinguish the vulnerable model-configuration case from a safe
  one by request content alone; correlate with which model the request
  targets
- Pattern library v1 -- review for environment-specific tuning before
  deployment
level: medium
tags:
