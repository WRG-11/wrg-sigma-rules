title: Template -- Security service stopped through command-line tooling
id: 0f5e2c97-f67b-5e7d-9ed9-8e02a2717ea5
status: experimental
description: >-
  Canonical Sigma detection template for MITRE ATT&CK T1489 (Service Stop).
  Detects common command-line service-control tools stopping Windows Defender,
  endpoint sensor, firewall, or update services. Synthetic exemplar from the
  WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to
  your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1489/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-09-16'
logsource:
  category: process_creation
  product: windows
detection:
  selection_service_control:
    Image|endswith:
    - '\sc.exe'
    - '\net.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  selection_stop:
    CommandLine|contains:
    - ' stop '
    - Stop-Service
  selection_security_service:
    CommandLine|contains:
    - WinDefend
    - Sense
    - MpsSvc
    - wuauserv
  condition: selection_service_control and selection_stop and selection_security_service
falsepositives:
- Approved maintenance or incident-response activity with a matching change
  record
- Endpoint agent upgrade that stops and restarts its own documented service
level: high
tags:
- attack.t1489
- wrg.template
- wrg.tactic.impact
