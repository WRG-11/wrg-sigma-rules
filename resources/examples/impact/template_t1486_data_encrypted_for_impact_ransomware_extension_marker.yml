title: Template -- Data Encrypted for Impact (ransomware extension marker) -- extension write (base)
name: t1486_ransomware_extension_marker_base
id: b8dc85b5-b548-543e-b98f-f6fbcf8d6978
status: experimental
description: Base event match for the T1486 ransomware-extension burst correlation
  below -- a single known-ransomware-extension write, on its own, is not the alert.
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: file_event
  product: windows
detection:
  selection_extension:
    TargetFilename|endswith:
    - .encrypted
    - .locked
    - .enc
    - .crypto
    - .lockbit
    - .alphv
    - .akira
    - .clop
  condition: selection_extension
level: informational
tags:
- attack.t1486
