description: 'Shared detection for 14 actors with an observed T1567 / T1567.002 incident: barracuda, blackwater, crpxo, emperador, genesis, global_secret_group,
  kairos, krybit, ms13_089, panzer, securotrop, shai_hulud_npm_worm, unknown_supply_chain_2025_03,
  worldleaks. The logic is a generic pattern, not the documented tradecraft of these actors,
  so a hit does not say which actor, if any, is responsible. Merged on 2026-09-30 from 14
  single-actor rules with identical logic (their ids are listed under related).'
