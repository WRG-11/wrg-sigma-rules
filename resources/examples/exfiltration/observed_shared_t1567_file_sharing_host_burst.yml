falsepositives:
- Approved business file transfer, backup synchronization, or incident-response collection
  to the named cloud service can produce the same network telemetry.
- Backup software uploading encrypted archives to a sanctioned cloud endpoint that happens
  to share infrastructure with a listed exfil host
- Employees using a sanctioned file-sharing service for authorized large-file transfer
