title: Template -- Event Triggered Execution (IFEO Debugger-key persistence)
id: accde563-b835-503e-8f7f-834ec78e19b5
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1546 (Event Triggered Execution (IFEO Debugger-key persistence)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1546/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: registry_set
  product: windows
detection:
  selection_ifeo_debugger:
    TargetObject|contains: \Image File Execution Options\
    TargetObject|endswith: \Debugger
  condition: selection_ifeo_debugger
falsepositives:
- Application Verifier, the Windows debugging tools and Visual Studio's launch-under-debugger setting, all of which write the Debugger value legitimately
- Vendor installers redirecting a legacy executable to a replacement shim through an IFEO Debugger entry
- Anti-malware and application-control products that use IFEO to block execution of a named binary
level: medium
tags:
- attack.t1546
- wrg.template
- wrg.tactic.persistence
