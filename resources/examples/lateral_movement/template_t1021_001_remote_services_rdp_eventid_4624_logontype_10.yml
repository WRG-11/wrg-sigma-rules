title: Template -- Remote Services (RDP / EventID 4624 LogonType 10)
id: 846ef798-a33a-5857-a3c8-5fff979b3b90
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1021.001 (Remote Services (RDP / EventID 4624 LogonType
  10)). Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1021/001/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: authentication
  product: windows
detection:
  selection_rdp:
    EventID: 4624
    LogonType: 10
  # R89-55b cycle-3 filter add — sister to observed_lapsus_t1078
  # (R89-54b backport) and template_t1078_valid_accounts (this PR
  # template 3). Authorized admin operators routinely access servers
  # via RDP (LogonType 10) for maintenance; the rule previously fired
  # on legit_rdp_logon (admin_dave / LogonType 10) in V cycle-2
  # (R89-55v). Filter requires BOTH conditions (Sigma selection-shape:
  # multi-clause within one filter block = AND).
  # Tradeoff: this is a single-event precision narrow. T1021.001 RDP
  # lateral movement in the wild is multi-host admin-credential reuse
  # within a short window; proper detection requires correlation
  # (count() by account across hosts over time). Phase 1b aggregation
  # matcher (V design-prep) will support that pattern; this filter is
  # the stop-gap.
  filter_legit_admin_interactive_rdp:
    LogonType: 10
    TargetUserName|startswith: admin_
  condition: selection_rdp and not filter_legit_admin_interactive_rdp
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
level: medium
tags:
- attack.t1021.001
- wrg.template
- wrg.tactic.lateral_movement
