title: Template -- Data from Local System (archive utility staging)
id: 1d76a4c4-c33e-5a85-b0ce-11ee62b8035d
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1005 (Data from Local System (archive utility staging)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1005/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: file_event
  product: windows
detection:
  selection_archive_staging:
    Image|endswith:
    - \7z.exe
    - \rar.exe
    - \winrar.exe
    - \powershell.exe
    CommandLine|contains:
    - \Users\
    - \Documents\
    - \Desktop\
    - .pst
    - .docx
    - .xlsx
    - .pdf
  condition: selection_archive_staging
falsepositives:
- Users archiving their own documents before a laptop refresh or project handover -- same archiver, same Documents/Desktop paths
- Backup and mailbox-migration tooling packaging .pst files on a schedule
- Helpdesk collecting a user profile or log bundle for a support case
level: medium
tags:
- attack.t1005
- wrg.template
- wrg.tactic.collection
