title: Template -- Local email collection (mail store opened by a non-mail process)
id: 0bbf2225-8b36-5a9e-bf56-ff8ed41f02ee
status: experimental
description: >-
  Canonical sigma detection template for MITRE ATT&CK T1114.001
  (Email Collection: Local Email Collection). Outlook data files hold a user's
  full correspondence in one place, which makes them a standing collection
  target. Opening one is not itself notable -- Outlook does it constantly --
  so the template keys on a mail store being read by something that is not a
  mail client or an indexing service, which is the shape a collection script
  or an archiver staging data takes. Synthetic exemplar from the
  WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to
  your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1114/001/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-07-29'
logsource:
  category: file_event
  product: windows
detection:
  selection_mail_store:
    TargetFilename|endswith:
    - .ost
    - .pst
    - .nst
  filter_mail_and_index_clients:
    Image|endswith:
    - \outlook.exe
    - \searchindexer.exe
    - \searchprotocolhost.exe
    - \searchfilterhost.exe
  condition: selection_mail_store and not filter_mail_and_index_clients
falsepositives:
- Backup and archiving software, which reads mail stores wholesale by design
  and is the single most likely source of this event
- Mailbox migration and PST-import tooling during a mail platform move
- Antivirus and DLP agents scanning the same files on access
- Third-party mail clients and add-ins that are not on the filter list --
  extend the filter rather than lowering the severity
level: medium
tags:
- attack.t1114.001
- wrg.template
- wrg.tactic.collection
