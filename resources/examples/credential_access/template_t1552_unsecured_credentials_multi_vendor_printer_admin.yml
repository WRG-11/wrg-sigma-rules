title: Template -- Unsecured Credentials (multi-vendor printer admin)
id: 0a0d5fad-41a0-53b8-b37b-9778b3ce41bc
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1552 (Unsecured Credentials (multi-vendor printer admin)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1552/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: proxy
detection:
  selection_printer_admin_paths:
    cs-uri-stem|contains:
    - /addrbook
    - /kmaddrbook
    - /cgi-bin/dynamic
    - /getPassword
    - /network/smb
    - /getSMBCredentials
    - /scanner/credentials
  filter_browser_admin_session:
    cs-user-agent|contains:
    - Mozilla
    - Chrome
    - Safari
    - Edge
  condition: selection_printer_admin_paths and not filter_browser_admin_session
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
level: medium
tags:
- attack.t1552
- wrg.template
- wrg.tactic.credential_access
