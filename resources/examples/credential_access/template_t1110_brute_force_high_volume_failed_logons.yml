title: Template -- Brute Force (high-volume failed logons)
id: 7db69aef-0d9d-5fc3-882e-3e683d7320bf
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1110 (Brute Force (high-volume failed logons)). Synthetic
  exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1110/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
correlation:
  type: event_count
  rules:
  - t1110_brute_force_failed_logon_base
  group-by:
  - SourceIP
  timespan: 10m
  condition:
    gt: 10
falsepositives:
- A service account with a rotated password still configured in a scheduled task, retrying on every run
- Shared egress (VPN concentrator, NAT gateway) putting many users behind one source address
- A misconfigured client or mapped drive reconnecting in a tight loop after a password change
level: medium
tags:
- attack.t1110
- wrg.template
- wrg.tactic.credential_access
- wrg.correlation
