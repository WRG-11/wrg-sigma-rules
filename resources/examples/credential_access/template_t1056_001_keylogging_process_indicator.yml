title: 'Template -- Input Capture: Keylogging (PowerShell keyboard hook)'
id: b1b24466-4d14-49a1-aea2-d6da2c5088bc
status: test
description: Detect PowerShell invoking the Windows SetWindowsHookEx keyboard-hook API. This is a narrow process-creation pattern; use EDR API telemetry for broader keylogging coverage.
references:
- https://attack.mitre.org/techniques/T1056/001/
- https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-09-10'
logsource:
  category: process_creation
  product: windows
detection:
  selection_powershell:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  selection_keyboard_hook:
    CommandLine|contains: SetWindowsHookEx
  condition: all of selection_*
falsepositives:
- An approved accessibility or QA test invokes a keyboard hook from a documented PowerShell script
- A defensive simulation or endpoint-management script intentionally exercises the API
level: high
tags:
- attack.t1056.001
- wrg.template
- wrg.tactic.credential_access
