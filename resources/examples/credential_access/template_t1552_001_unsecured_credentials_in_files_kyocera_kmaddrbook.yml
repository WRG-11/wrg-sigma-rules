title: Template -- Unsecured Credentials in Files (Kyocera kmaddrbook)
id: f152dc18-5aa2-5688-8c0f-e1236dd5e7ff
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1552.001 (Unsecured Credentials in Files (Kyocera kmaddrbook)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1552/001/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: webserver
detection:
  selection_kmaddrbook_endpoint:
    cs-method:
    - GET
    - POST
    cs-uri-stem|contains:
    - /kmaddrbook
    - /addrbook
  filter_browser_admin_session:
    cs-user-agent|contains:
    - Mozilla
    - Chrome
    - Safari
    - Edge
  condition: selection_kmaddrbook_endpoint and not filter_browser_admin_session
falsepositives:
- Print-management software synchronising the device address book on a schedule
- Asset-inventory or vulnerability scanners fingerprinting printer web interfaces
level: medium
tags:
- attack.t1552.001
- wrg.template
- wrg.tactic.credential_access
