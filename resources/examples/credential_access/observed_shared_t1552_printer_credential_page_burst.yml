logsource:
  category: proxy
detection:
  selection_printer_admin_paths:
    cs-uri-stem|contains:
    - /addrbook
    - /kmaddrbook
    - /cgi-bin/dynamic
    - /getPassword
    - /network/smb
    - /getSMBCredentials
    - /scanner/credentials
  filter_browser_admin_session:
    cs-user-agent|contains:
    - Mozilla
    - Chrome
    - Safari
    - Edge
  condition: selection_printer_admin_paths and not filter_browser_admin_session
level: informational
tags:
- attack.t1552
