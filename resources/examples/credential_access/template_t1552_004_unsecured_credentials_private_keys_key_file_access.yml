title: Template -- Unsecured Credentials Private Keys (key-file access)
id: a2c30152-fc4a-512f-8c93-c583228ecc3b
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1552.004 (Unsecured Credentials Private Keys (key-file access)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1552/004/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: file_event
  product: windows
detection:
  selection_private_key_file:
    TargetFilename|endswith:
    - .pem
    - .ppk
    - .pfx
    - .key
    - id_rsa
    - id_ed25519
    - id_ecdsa
  condition: selection_private_key_file
falsepositives:
- Certificate lifecycle tooling writing .pfx and .pem on renewal (ACME/certbot clients, Certificate Manager import and export), which arrives as a burst on the renewal schedule from a service account
- SSH and Git clients reading id_rsa or id_ed25519 at session start, which on a developer workstation happens every session
- Backup and endpoint-scanning agents that walk an entire profile directory and open key files without the contents ever leaving the host
level: medium
tags:
- attack.t1552.004
- wrg.template
- wrg.tactic.credential_access
