title: Template -- OS Credential Dumping (LSASS access, mimikatz) -- access (base)
name: t1003_lsass_access_base
id: 61f1903a-7227-5dc0-882c-95522d071115
status: experimental
description: Base event match for the T1003 LSASS-access burst correlation below --
  a single suspicious LSASS handle open, on its own, is not the alert.
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_lsass:
    TargetImage|endswith: \lsass.exe
    GrantedAccess:
    - '0x1010'
    - '0x1410'
    - '0x1438'
  condition: selection_lsass
level: informational
tags:
- attack.t1003
---
title: Template -- OS Credential Dumping (LSASS access, mimikatz)
id: 009c0389-99c6-5961-a32e-1a7448f41128
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1003 (OS Credential Dumping (LSASS access, mimikatz)). Synthetic
  exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1003/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
correlation:
  type: event_count
  rules:
  - t1003_lsass_access_base
  group-by:
  - SourceImage
  timespan: 5m
  condition:
    gt: 5
falsepositives:
- EDR, antivirus and memory-scanning agents, which open handles to lsass.exe as part of normal inspection
- Windows Error Reporting or a crash-dump collector capturing lsass during a fault
- IT running procdump against lsass while debugging an authentication problem
level: medium
tags:
- attack.t1003
- wrg.template
- wrg.tactic.credential_access
- wrg.correlation
