title: Template -- Password Spraying (many accounts, few attempts each)
id: 3197ef22-ad39-5fa0-b841-bb7f91acd312
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1110.003 (Password
  Spraying). Counts DISTINCT target accounts from one source rather than total failed
  logons, because spraying is deliberately shaped to stay under per-account lockout
  thresholds -- a sprayer trying three passwords against four hundred accounts never
  trips a volume rule, while a single locked-out user with a stale credential trips
  it constantly. Synthetic exemplar from the WinstonRedGuard threat-intel corpus --
  no actor binding; review and bind to your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1110/003/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-07-29'
correlation:
  type: value_count
  rules:
  - t1110_003_password_spray_failed_logon_base
  group-by:
  - IpAddress
  timespan: 30m
  condition:
    field: TargetUserName
    gt: 15
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
- A shared egress IP (VPN concentrator, NAT gateway, proxy) aggregates many users,
  so distinct-account counts group by infrastructure rather than by actor; exclude
  those source addresses or group by a client identifier instead
- Scheduled service or scanner authenticating as many accounts against a directory
level: medium
tags:
- attack.t1110.003
- wrg.template
- wrg.tactic.credential_access
- wrg.correlation
