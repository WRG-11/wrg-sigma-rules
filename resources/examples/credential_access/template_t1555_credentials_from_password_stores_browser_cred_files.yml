title: Template -- Credentials from Password Stores (browser cred files)
id: 0f11ecbf-da68-59fc-8e4f-f82279febbb2
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1555 (Credentials from Password Stores (browser cred files)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1555/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_browser_creds:
    TargetFilename|contains:
    - \Google\Chrome\User Data\
    - \Microsoft\Edge\User Data\
    - \Mozilla\Firefox\Profiles\
  condition: selection_browser_creds
falsepositives:
- Profile-migration and backup tooling copying browser profile directories during a device refresh
- A password manager's built-in import feature reading the browser credential store with the user's consent
- Forensic or incident-response collection running with authorisation
level: medium
tags:
- attack.t1555
- wrg.template
- wrg.tactic.credential_access
