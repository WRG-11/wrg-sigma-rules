title: Template -- File and Directory Discovery (recon commands)
id: 46df2d03-93bb-55e3-89f7-8b77ab9c657d
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1083 (File and Directory Discovery (recon commands)). Synthetic
  exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1083/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_discovery_command:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - dir /s
    - dir /a
    - tree /f
    - Get-ChildItem -Recurse
    - gci -recurse
  condition: selection_discovery_command
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
level: medium
tags:
- attack.t1083
- wrg.template
- wrg.tactic.discovery
