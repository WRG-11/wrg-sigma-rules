title: Template -- Nmap Network Service Discovery
id: 8b0ad486-d97b-4834-ada2-2ab1f5f72017
status: experimental
description: >-
  Canonical Sigma detection template for MITRE ATT&CK T1046 (Network Service
  Discovery). Detects Nmap executions using explicit TCP, UDP, version, or
  port-selection scan modes. Synthetic exemplar from the WinstonRedGuard
  threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1046/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-09-16'
logsource:
  category: process_creation
  product: windows
detection:
  selection_nmap:
    Image|endswith: '\nmap.exe'
  selection_scan_mode:
    CommandLine|contains:
    - ' -sS'
    - ' -sT'
    - ' -sU'
    - ' -sV'
    - ' -p '
  condition: selection_nmap and selection_scan_mode
falsepositives:
- Authorized vulnerability assessments, red-team exercises, and inventory scans
  using Nmap
- Administrator-led troubleshooting of a documented network outage
level: medium
tags:
- attack.t1046
- wrg.template
- wrg.tactic.discovery
