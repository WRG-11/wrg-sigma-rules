title: LLM-typical ANSI color helper class pattern
id: bafcf74a-952a-5b9f-85cd-fab0ef49bc09
status: experimental
description: 'Detects the recurring ''Colors'' helper class with hardcoded ANSI escape sequences (RED, GREEN, RESET, ...).
  Almost every LLM-generated CLI re-emits this exact pattern; production code typically uses `colorama` or `rich` instead.


  Aggregated from 1 fingerprint hit(s) across 1 file(s). Sample paths: apps/foo/baz.py.'
references:
- https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access
author: WinstonRedGuard -- sigma plugin ai-fingerprint observed rules
date: '2026-05-13'
logsource:
  category: code_review
  product: wrg_ai_fingerprint
detection:
  selection:
    detector: ansi_color_class
    evidence|contains:
    - 'class Colors: RED = ''\033[91m'''
  condition: selection
falsepositives:
- Pre-LLM scripts that genuinely use raw ANSI escape codes
- Embedded systems with no terminal library available
level: informational
tags:
- attack.t1027
- wrg.ai_fingerprint
- wrg.detector.ansi_color_class
- wrg.severity.informational
- wrg.observed
- wrg.tactic.code_review
