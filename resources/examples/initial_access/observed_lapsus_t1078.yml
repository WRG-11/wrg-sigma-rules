title: LAPSUS$ -- T1078
id: b6d23664-a6e7-583a-b2fc-f54bd7ef04e6
status: test
description: Breach intel signature for actor lapsus, MITRE technique T1078. Derived from 1 observed incident(s) in the WRG
  breach catalog.
references:
- https://attack.mitre.org/techniques/T1078/
- https://attack.mitre.org/groups/G1004/
- https://example.test/lapsus-vodafone
author: WinstonRedGuard -- sigma plugin observed rules (derived from breach corpus)
date: '2026-05-10'
logsource:
  category: authentication
  product: windows
detection:
  selection_logon:
    EventID:
    - 4624
    - 4625
    LogonType:
    - 3
    - 10
  filter_service_accounts:
    TargetUserName|startswith: svc_
  # R89-54b backport of R89-33b cycle-1 FP-fix (golden fixture
  # apps/wrg_threat_intel/tests/fixtures/sigma/lapsus_t1078_golden.yml).
  # Authorized admin operators routinely access servers via RDP
  # (LogonType 10) for maintenance; the rule previously fired on
  # legit_rdp_logon (admin_dave / LogonType 10) in V Phase 1a benign
  # corpus. Filter requires BOTH conditions (Sigma selection-shape:
  # multi-clause within one filter block = AND).
  # Tradeoff: this is a single-event precision narrow. The lapsus
  # actor signature is multi-host admin-credential reuse within a
  # short window -- proper detection requires correlation (count() by
  # account across hosts over time). Phase 1b aggregation matcher (V
  # design-prep) will support that pattern; this filter is the Phase
  # 1a stop-gap that keeps precision-on-benign at 1.00.
  filter_legit_admin_interactive_rdp:
    LogonType: 10
    TargetUserName|startswith: admin_
  condition: selection_logon and not filter_service_accounts and not filter_legit_admin_interactive_rdp
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
level: high
tags:
- attack.t1078
- wrg.observed.actor.lapsus
- wrg.severity.high
- wrg.observed
- wrg.tactic.initial_access
