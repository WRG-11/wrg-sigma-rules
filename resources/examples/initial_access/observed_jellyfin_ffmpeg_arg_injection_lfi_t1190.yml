title: Jellyfin FFmpeg Argument Injection Arbitrary File Read via drawtext/textfile -- CVE-2026-35033 (T1190)
id: a7799ce3-fbab-42e3-bd36-a48ebbf4a40f
status: experimental
description: 'Detects exploitation of CVE-2026-35033 -- an unauthenticated
  arbitrary file read in Jellyfin (< 10.11.7) via FFmpeg argument injection.

  Root cause (source diff v10.11.6 -> v10.11.7,
  Jellyfin.Api/Helpers/StreamingHelpers.cs ParseParams): the codec and level
  query parameters of /Videos/{itemId}/stream (VideoCodec, AudioCodec,
  Profile, SubtitleCodec, Level) were assigned from user input without
  validation and concatenated directly into the FFmpeg command line. The
  10.11.7 fix gates each value behind IsValidCodecName
  (^[a-zA-Z0-9\-\._,|]{0,40}$) / a numeric Level regex -- so a legitimate
  value can never contain a space, "=", or "/".

  Exploitation: an attacker injects a value such as
  "h264 -vf drawtext=textfile=/etc/passwd:..." into one of those codec
  parameters. The embedded space breaks argument parsing (argument
  injection), adding an FFmpeg "-vf drawtext" video filter whose
  "textfile=" source points at a sensitive server file (e.g. /etc/passwd,
  /etc/shadow). FFmpeg renders the file contents as text into the output
  video stream, leaking them to the requester. The /Videos/{itemId}/stream
  endpoint has no [Authorize] attribute (unauthenticated), though a valid
  pseudo-random item GUID is required.

  Detection rationale: legitimate Jellyfin transcoding never emits the
  FFmpeg "drawtext" filter or a "textfile=" argument (confirmed absent from
  MediaBrowser.Controller/MediaEncoding/EncodingHelper.cs; Jellyfin uses the
  "subtitles"/overlay filters for subtitle burn-in, and Skia -- not FFmpeg
  drawtext -- for image text). A Jellyfin-spawned ffmpeg / jellyfin-ffmpeg
  process whose command line contains BOTH "drawtext" and "textfile=" is
  therefore high-fidelity for this injection.

  Secondary telemetry (not modelled here -- different logsource): the
  reverse-proxy / Jellyfin access log will show a /Videos/*/stream request
  whose query string carries a codec/level parameter with URL-encoded
  spaces and "drawtext"/"textfile=" markers.'
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://github.com/jellyfin/jellyfin/security/advisories/GHSA-jh22-fw8w-2v9x
  - https://www.sentinelone.com/vulnerability-database/cve-2026-35033/
author: WinstonRedGuard -- sigma plugin observed rules (derived from public CVE disclosure + source diff)
date: '2026-06-07'
tags:
  - attack.initial_access
  - attack.t1190
  - cve.2026.35033
  - wrg.observed.cve.cve_2026_35033_jellyfin_ffmpeg_arg_injection
  - wrg.observed.vector.ffmpeg_argument_injection_drawtext_textfile_lfi
  - wrg.observed.source.jellyfin_advisory_ghsa_jh22_fw8w_2v9x
  - wrg.severity.high
logsource:
  category: process_creation
detection:
  selection_ffmpeg:
    # Separator-agnostic: matches ffmpeg + jellyfin-ffmpeg on Linux
    # (/usr/lib/jellyfin-ffmpeg/ffmpeg) and Windows (jellyfin-ffmpeg.exe),
    # regardless of path-separator normalisation. Precision comes from
    # selection_arg_injection below.
    Image|endswith:
      - 'ffmpeg'
      - 'ffmpeg.exe'
  selection_arg_injection:
    CommandLine|contains|all:
      - 'drawtext'
      - 'textfile='
  condition: selection_ffmpeg and selection_arg_injection
falsepositives:
  - Video-production, broadcast, or watermarking pipelines that legitimately invoke the FFmpeg "drawtext" filter with a "textfile=" source. This is uncommon on a dedicated Jellyfin media-server host (Jellyfin transcoding does not use drawtext); on shared hosts, scope by host role or add a ParentImage filter (jellyfin / dotnet / jellyfin server process) to eliminate.
  - Administrator-run diagnostic FFmpeg commands using drawtext+textfile against non-sensitive files. Correlate the "textfile=" path against sensitive targets (/etc/, /proc/, /root/, path-traversal "..") to prioritise.
level: high
