title: Miasma npm worm -- T1195.002 binding.gyp gyp command-substitution code execution
id: 0c9ed708-b102-4d0f-b1b2-053a69c315ca
status: experimental
description: |
  Campaign-bound sigma detection for the "Miasma" / "Phantom Gyp" npm
  supply-chain worm (StepSecurity + Snyk disclosure, 2026-06-03; a
  descendant of the Shai-Hulud worm family, distinct from the earlier
  Mini Shai-Hulud / Nx campaign cluster already in this corpus). Compromised
  57 npm packages across 286+ malicious versions in a rolling campaign
  under two hours, first observed via `@vapi-ai/server-sdk` (408,000+
  monthly downloads).

  Attack mechanism ("Phantom Gyp"): a 157-byte `binding.gyp` file abuses
  node-gyp's `<!(...)` command-substitution syntax to run an arbitrary
  shell command during the gyp CONFIGURE phase, before any compiler runs --
  `"sources": ["<!(node index.js > /dev/null 2>&1 && echo stub.c)"]` with
  `"type": "none"` (nothing is actually compiled; the command's side effect
  is the point). npm auto-invokes `node-gyp rebuild` whenever it sees a
  `binding.gyp` file, and this happens WITHOUT declaring any
  preinstall/postinstall lifecycle script in `package.json` -- invisible to
  tooling that only watches install-hook fields. The `index.js` payload
  that runs is a 4.5MB obfuscated loader (ROT-14, then AES-128-GCM
  self-decryption) that downloads and executes a Bun runtime binary
  (`bun-v1.3.13`) to run the actual 649KB credential-stealer payload under
  Bun instead of Node -- process-tree monitoring that only watches for
  `node.exe` child processes never sees the credential-theft stage.

  Detection logic flags a `node-gyp`/gyp-driven build step spawned by an
  npm-family package manager that is immediately followed by a Bun binary
  being downloaded and executed as a child of the same install lineage --
  Bun has no legitimate reason to appear inside a `node-gyp rebuild` step,
  which is a native-addon compile action, not a JS runtime swap.

  Sourced from two independent technical write-ups (StepSecurity primary
  disclosure, Snyk corroboration quoting the same 157-byte `binding.gyp`
  body and `stub.c` placeholder verbatim) rather than a single vendor's
  restatement.

  Aggregated from 2 independent technical disclosures, 2026-06-03/04
  (StepSecurity, Snyk).
references:
- https://www.stepsecurity.io/blog/binding-gyp-npm-supply-chain-attack-spreads-like-worm
- https://snyk.io/blog/node-gyp-supply-chain-compromise-self-propagating-npm-worm-binding-gyp/
- https://attack.mitre.org/techniques/T1195/002/
- https://attack.mitre.org/techniques/T1059/007/
author: WinstonRedGuard -- sigma plugin observed rules (derived from breach corpus)
date: '2026-08-11'
logsource:
  category: process_creation
  product: windows
detection:
  selection_gyp_rebuild:
    ParentImage|endswith:
    - \npm.cmd
    - \npm.exe
    - \npm-cli.js
    - \pnpm.cmd
    - \pnpm.exe
    - \yarn.cmd
    - \yarn.exe
    - \bun.exe
    CommandLine|contains:
    - node-gyp rebuild
    - node-gyp configure
  selection_bun_runtime_fetch_or_exec:
    Image|endswith:
    - \bun.exe
    - \curl.exe
    - \wget.exe
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - bun.sh
    - bun-linux
    - bun-windows
    - bun-darwin
    - bun.exe
  condition: selection_gyp_rebuild and selection_bun_runtime_fetch_or_exec
falsepositives:
- A developer or CI runner that legitimately uses Bun as its primary JS runtime for an unrelated project, where a native-addon build step and a Bun invocation happen to occur close together for reasons unconnected to this campaign -- correlate with a preceding `binding.gyp`-triggered `node-gyp` step from a freshly-installed package, not a long-lived project's own build pipeline
- Pattern library v1 -- review for environment-specific tuning before deployment
level: high
tags:
- attack.t1195.002
- attack.t1059.007
