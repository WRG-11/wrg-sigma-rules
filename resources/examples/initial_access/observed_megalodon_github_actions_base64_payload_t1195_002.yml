title: Megalodon GitHub Actions Base64-Encoded Workflow Payload -- T1195.002
id: 4133ef67-73f3-4b48-94db-b5489422b0cc
status: experimental
description: 'Detects a base64-decoded inline shell payload in a GitHub Actions
  workflow audit event. StepSecurity reported that the Megalodon supply-chain
  campaign injected malicious workflow files into more than 5,500 repositories
  within six hours and that both observed workflow variants contained a
  base64-encoded bash payload decoded and executed during the CI run.

  This rule intentionally encodes only the workflow-content signal:
  action == workflow_run plus a workflow_ref matching an inline
  echo/printf | base64 -d | shell pattern. It does not encode the reported
  six-hour campaign window, repository volume, account creation, pull-request
  activity, credential collection, or network exfiltration. A hit therefore
  means a suspicious workflow payload pattern, not confirmed Megalodon
  activity.

  Deployment must map workflow content into workflow_ref (or an equivalent
  normalized audit field). The cited report establishes the workflow payload,
  not this backend-specific audit schema.'
references:
  - https://attack.mitre.org/techniques/T1195/002/
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1140/
  - https://www.stepsecurity.io/blog/megalodon-mass-github-actions-secret-exfiltration-across-5-500-public-repositories
author: WRG-11
date: 2026/05/25
tags:
  - attack.initial_access
  - attack.execution
  - attack.t1195.002
  - attack.t1059.004
  - attack.t1140
  - wrg.observed
  - wrg.severity.high
  - wrg.tactic.initial_access
logsource:
  product: github
  service: audit
detection:
  selection_workflow_action:
    action: workflow_run
  selection_base64_payload_pattern:
    workflow_ref|re: '(echo|printf)\s+[A-Za-z0-9+/]{50,}\s*\|\s*base64\s+-d\s*\|\s*(bash|sh|pwsh|powershell)'
  condition: selection_workflow_action and selection_base64_payload_pattern
falsepositives:
  - Legitimate build pipelines using base64-encoded artifact packaging (uncommon for inline run steps)
  - Security researcher dry-runs against canary repositories
  - Tutorial / training content demonstrating base64 encoding (low priority FP)
level: high
