title: Open WebUI Playwright web loader -- T1190 unvalidated sub-resource requests reach blocked internals
id: 37dc291a-48e4-4386-8616-6619b021c3d2
status: experimental
description: |
  Vendor-disclosed detection for CVE-2026-70479 (GHSA-w2rx-84hp-gg95,
  CVSS 7.7 HIGH), affecting Open WebUI from 0.9.6 until 0.11.0.

  With `WEB_LOADER_ENGINE=playwright`, the Playwright web loader validated
  only the TOP-LEVEL page request against the blocked-address policy,
  letting SUB-RESOURCE requests the loaded page issues (via its own
  JavaScript) pass entirely unvalidated. An authenticated user supplying
  a URL can have that page's script reach internal addresses the
  top-level check would have refused, and the returned DOM -- including
  data read from those internal addresses -- flows into web-search or RAG
  output that the requesting user then sees.

  Detection logic flags a Playwright-rendered page fetch whose CAPTURED
  sub-resource requests (network requests the browser context issued
  while rendering) target a private/loopback/link-local address the
  top-level URL itself did not -- since the top-level check already
  passed by definition, only a sub-resource mismatch indicates the gap
  this advisory describes.

  Aggregated from 1 first-party vendor security advisory (open-webui, via
  GHSA and NVD, citing the exact PR), fixed in 0.11.0.
references:
- https://github.com/open-webui/open-webui/security/advisories/GHSA-w2rx-84hp-gg95
- https://github.com/open-webui/open-webui/commit/bef63a2ae915571d50d2722a635e8bfa753d7877
- https://github.com/open-webui/open-webui/pull/27526
- https://attack.mitre.org/techniques/T1190/
author: WinstonRedGuard -- sigma plugin observed rules (derived from breach corpus)
date: '2026-08-11'
logsource:
  category: proxy
  product: ""
detection:
  selection_playwright_loader_context:
    Image|endswith: /playwright
  selection_internal_subresource_target:
    cs-uri-query|contains:
    - '127.'
    - '169.254.'
    - '10.'
    - '192.168.'
  condition: selection_playwright_loader_context and selection_internal_subresource_target
falsepositives:
- A deployment already upgraded to 0.11.0+, where sub-resource requests
  are validated against the same blocked-address policy as the top-level
  page -- a matching sub-resource request on a fixed deployment would be
  refused before it reaches the target
- A deployment not using `WEB_LOADER_ENGINE=playwright` (the default or
  another loader engine) -- this vulnerability is specific to the
  Playwright rendering path and does not apply otherwise
- Pattern library v1 -- review for environment-specific tuning before
  deployment; this rule requires browser-context network-request
  logging correlated to the Playwright loader process, which most
  infrastructure log sources do not capture by default
level: high
tags:
- attack.t1190
- wrg.observed.cve.cve_2026_70479
