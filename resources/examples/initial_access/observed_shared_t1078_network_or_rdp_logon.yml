title: Network or RDP Logon Outside Service and Admin Accounts
id: b9b55a5e-e741-5685-bd8e-bdd6f28611f4
status: test
description: 'Shared detection for 2 actors with an observed T1078 incident: auditteam, ransomhouse. The logic is a generic pattern, not the documented tradecraft
  of these actors, so a hit does not say which actor, if any, is responsible. Merged on 2026-09-30
  from 2 single-actor rules with identical logic (their ids are listed under related).'
references:
- https://attack.mitre.org/techniques/T1078/
- https://www.ransomware.live/group/AuditTeam
- https://ransomwhere.org/groups/AuditTeam
- https://www.dexpose.io/auditteam-ransomware-attack-on-calm/
- https://unit42.paloaltonetworks.com/ransomhouse-encryption-upgrade/
- https://www.fortiguard.com/threat-actor/6250/ransomhouse-ransomware
author: WinstonRedGuard -- sigma plugin observed rules (derived from breach corpus)
date: '2026-08-19'
modified: '2026-09-30'
related:
- id: abe6b6cc-8877-549d-88cc-9f055175b318
  type: merged
- id: c1081084-e2c8-5867-8a32-201d4af9afec
  type: merged
logsource:
  product: windows
  service: security
detection:
  selection_logon:
    EventID:
    - 4624
    - 4625
    LogonType:
    - 3
    - 10
  filter_service_accounts:
    TargetUserName|startswith: svc_
  # false-positive fix (first tuning cycle): legitimate admin
  # interactive RDP (LogonType 10) tripped the rule). Authorized
  # admin operators routinely access servers via RDP for maintenance;
  # the rule fired on legit_rdp_logon (admin_dave / LogonType 10).
  #
  # Narrow exclusion (chosen over a broader filter):
  # exclude interactive RDP (LogonType 10) by admin-prefixed accounts.
  # Filter requires BOTH conditions (selection-shape: multi-clause
  # within one filter block = AND).
  #
  # Auto-attack canonical event (built from selection_logon first
  # values: EventID=4624, LogonType=3, no TargetUserName) does NOT
  # match LogonType=10 -> filter inert -> rule still fires.
  # Self-consistency preserved.
  #
  # Known tradeoff (documented for V re-verify + Phase 2 evaluation):
  # this is a SINGLE-EVENT precision narrow. The lapsus actor
  # signature is multi-host admin-credential reuse within a short
  # window -- proper detection requires correlation (count() by
  # account across hosts over time). Phase 1b aggregation matcher
  # (V design-prep) will support that pattern; this filter is the
  # Phase 1a stop-gap that keeps precision-on-benign at 1.00.
  filter_legit_admin_interactive_rdp:
    LogonType: 10
    TargetUserName|startswith: admin_
  condition: selection_logon and not filter_service_accounts and not filter_legit_admin_interactive_rdp
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
- 'an internal tuning cycle: aggregation (count() by TargetUserName > 3 in 15m) dropped --
  pySigma parses the pipe form but every real backend rejects it at conversion time (see T1567.001''s
  documented fix for the same class). Single-event precision narrow until a correlation-rule
  pairing is authored.'
level: medium
tags:
- attack.t1078
- wrg.observed
- wrg.observed.actor.auditteam
- wrg.observed.actor.ransomhouse
- wrg.severity.medium
- wrg.tactic.initial_access
