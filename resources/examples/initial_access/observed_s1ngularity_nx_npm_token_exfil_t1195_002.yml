title: s1ngularity Nx CLI token exfiltration -- post-install credential scan or bulk egress (base)
name: s1ngularity_nx_post_install_suspicious_base
id: 7ae7d624-ead6-463d-917c-767d4f08b626
status: test
description: Base event match for the s1ngularity Nx correlation below -- a
  post-install process touching known credential-file locations, OR egressing via
  a bulk-POST-shaped command, on its own, is not the alert.
author: WinstonRedGuard -- sigma plugin observed rules (derived from Docker disclosure)
date: '2026-05-24'
logsource:
  category: process_creation
  product: windows
detection:
  selection_post_install_credential_scan:
    ParentImage|endswith:
    - \node.exe
    - \npm.cmd
    - \npm.exe
    - \pnpm.cmd
    CommandLine|contains:
    - .npmrc
    - .aws/credentials
    - GITHUB_TOKEN
    - NPM_TOKEN
    - AWS_ACCESS_KEY
    - .ssh/id_
  selection_post_install_bulk_egress:
    ParentImage|endswith:
    - \node.exe
    Image|endswith:
    - \curl.exe
    - \wget.exe
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - -X POST
    - Invoke-WebRequest
    - Invoke-RestMethod
  condition: selection_post_install_credential_scan or selection_post_install_bulk_egress
level: informational
tags:
- attack.t1552.001
- attack.t1041
