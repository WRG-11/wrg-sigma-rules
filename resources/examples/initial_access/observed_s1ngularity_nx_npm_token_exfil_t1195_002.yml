author: WinstonRedGuard -- sigma plugin observed rules (derived from Docker disclosure)
date: '2026-05-24'
logsource:
  category: process_creation
  product: windows
detection:
  selection_npm_install_nx_family:
    ParentImage|endswith:
    - \npm.cmd
    - \npm.exe
    - \pnpm.cmd
    - \pnpm.exe
    - \yarn.cmd
    - \yarn.exe
    - \bun.exe
    CommandLine|contains:
    - install nx
    - install @nrwl/nx
    - install -g nx
    - 'nx@'
  selection_post_install_credential_scan:
    ParentImage|endswith:
    - \node.exe
    - \npm.cmd
    - \npm.exe
    - \pnpm.cmd
    CommandLine|contains:
    - .npmrc
    - .aws/credentials
    - GITHUB_TOKEN
    - NPM_TOKEN
    - AWS_ACCESS_KEY
    - .ssh/id_
  selection_post_install_bulk_egress:
    ParentImage|endswith:
    - \node.exe
    Image|endswith:
    - \curl.exe
    - \wget.exe
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - -X POST
    - Invoke-WebRequest
    - Invoke-RestMethod
  condition: selection_npm_install_nx_family and (selection_post_install_credential_scan or selection_post_install_bulk_egress)
falsepositives:
- Legitimate Nx CLI install at safe versions for new project bootstrap -- pin version range against Docker disclosure indicators of compromise (IoC) and exclude known-safe versions
- Build pipeline that reads .npmrc / GITHUB_TOKEN as part of normal CI workflow -- exclude by source-host identity (CI runner hostname) or session-user (svc account)
- Developer-tool egress with curl / Invoke-WebRequest is common in install scripts that fetch supplementary assets -- combine with credential-file scan selection to reduce false positives
- Pattern library v1 -- review for environment-specific tuning before deployment
level: high
