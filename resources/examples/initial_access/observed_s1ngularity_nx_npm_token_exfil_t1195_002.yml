title: s1ngularity Nx CLI token exfiltration -- Nx install step (base)
name: s1ngularity_nx_install_base
id: fe118be0-6775-4394-b039-562938fb0925
status: test
description: Base event match for the s1ngularity Nx correlation below -- an npm
  install targeting the Nx package family, on its own, is not the alert (legitimate
  new-project bootstrap looks identical).
author: WinstonRedGuard -- sigma plugin observed rules (derived from Docker disclosure)
date: '2026-05-24'
logsource:
  category: process_creation
  product: windows
detection:
  selection_npm_install_nx_family:
    ParentImage|endswith:
    - \npm.cmd
    - \npm.exe
    - \pnpm.cmd
    - \pnpm.exe
    - \yarn.cmd
    - \yarn.exe
    - \bun.exe
    CommandLine|contains:
    - install nx
    - install @nrwl/nx
    - install -g nx
    - 'nx@'
  condition: selection_npm_install_nx_family
level: informational
tags:
- attack.t1195.002
