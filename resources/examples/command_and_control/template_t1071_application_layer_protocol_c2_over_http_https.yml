title: Template -- Application Layer Protocol (C2 over HTTP/HTTPS) -- connection (base)
name: c2_http_application_layer_base
id: 638088a7-254d-5bfe-86d0-87d91c20c319
status: experimental
description: Base event match for the T1071 C2-over-HTTP burst correlation below --
  a single script-interpreter web connection, on its own, is not the alert.
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: network_connection
  product: windows
detection:
  selection_c2_http:
    DestinationPort:
    - 80
    - 443
    - 8080
    - 8443
    Image|endswith:
    - \powershell.exe
    - \cmd.exe
    - \wscript.exe
    - \mshta.exe
    - \rundll32.exe
  condition: selection_c2_http
level: informational
tags:
- attack.t1071
