title: Secret Scanner Crash as Deliberate Defense Evasion Vector -- T1027 (H Wave 8 L3-04 + DG-W7-01)
id: 1f73044a-d9da-4855-a56c-60448a8fb61f
status: experimental
description: 'Detects malicious PR pattern designed to crash or
  fast-fail a CI-stage secret scanner (Bandit, devguard, gitleaks,
  trufflehog) so the scan reports PASS without actually scanning content
  that contains a credential.

  Attack chain (H Wave 8 L3-04 + DG-W7-01 adversarial path):

  (1) Attacker crafts a PR containing (a) a large binary or
  pathologically-structured input file designed to trigger scanner
  timeout / OOM / parser exception, AND (b) a credential (gho_/ghu_/ghs_
  PAT variant; sister to observed_gh_pat_token_type_confusion_t1552.yml).

  (2) CI invokes scanner against changed files. Scanner crashes early
  (parser exception, timeout, OOM) and the wrapping check_run completes
  with `success` status because the wrapper script does not differentiate
  scanner-clean-exit from scanner-crash-exit (DG-W7-01: TimeoutExpired
  not propagated as a failure signal).

  (3) PR merges. Credential exposed in repo or downstream CI logs.

  (4) Distinguishing signature of crash-as-evasion vs legitimate scanner
  pass:
  - Scanner runtime extremely short (< 5 seconds) on a meaningfully-
    sized changeset (size_kb > 50)
  - check_run conclusion == success
  - Scanner process exit code anomaly OR scanner stderr non-empty with
    crash trace (parser exception, timeout)

  Detection logic targets github.audit / CI pipeline events with the
  composite (short-runtime + success-conclusion + size-mismatch) profile.
  Sister to DG-W7-01 (B R89-16b fix: TimeoutExpired propagation) and
  observed_gh_pat_token_type_confusion_t1552.yml (the credential surface
  that survives the evasion).

  Threat intel context: T1027 (Obfuscated Files / Information) typically
  covers payload obfuscation; this rule extends T1027 to cover
  scanner-evasion-via-crash as a defense-evasion sub-pattern. Sister
  alphv T1027 obfuscation rule in same category
  (observed_alphv_t1027_obfuscation.yml) covers payload-encoding form;
  this rule covers control-flow-disruption form.

  Source: Tier 0 H Wave 8 L3-04 + DG-W7-01 adversarial layer-3 deepdive
  (artifacts/bug-hunts/r89-13/wave-8-layer3-adversarial-scenarios.md
  L3-04). Sister cross-link: observed_gh_pat_token_type_confusion_t1552
  (this rule covers the evasion mechanism; the PAT-confusion rule covers
  the credential vector enabled by the evasion).'
references:
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1562/001/
author: WRG-11 D R89-11d (H Wave 8 L3-04 + DG-W7-01 source)
date: 2026/05/25
tags:
  - attack.defense_evasion
  - attack.t1027
  - attack.t1562.001
logsource:
  product: github
  service: audit
detection:
  selection_check_run_complete:
    action: check_run.completed
    conclusion: success
  selection_anomalous_duration:
    # SIEM-side numeric comparison; values in seconds
    DurationSeconds|lt: 5
  selection_meaningful_changeset:
    # Changeset size in KB; values >50 indicate non-trivial scan input
    ChangesetSizeKb|gte: 50
  condition: selection_check_run_complete and selection_anomalous_duration and selection_meaningful_changeset
falsepositives:
  - Genuinely empty PRs (no scannable Python content; scanner correctly exits fast)
  - Scanner caching hits (incremental scan reusing prior clean state)
  - Cached PR re-runs after upstream fix (e.g., rerun trigger after fork update)
level: high
