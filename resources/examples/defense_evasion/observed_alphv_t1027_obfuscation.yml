logsource:
  category: file_event
  product: windows
detection:
  selection_encoded_powershell:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -e '
  selection_long_base64_blob:
    CommandLine|re: '[A-Za-z0-9+/]{200,}={0,2}'
  condition: selection_encoded_powershell or selection_long_base64_blob
falsepositives:
- Pattern library v1 -- review for environment-specific tuning before deployment
level: high
