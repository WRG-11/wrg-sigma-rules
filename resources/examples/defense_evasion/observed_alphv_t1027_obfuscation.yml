status: test
description: Breach intel signature for actor alphv, MITRE technique T1027. Derived from 1 observed incident(s) in the WRG
  breach catalog.
references:
- https://attack.mitre.org/techniques/T1027/
- https://attack.mitre.org/groups/G1015/
- https://example.test/mgm
