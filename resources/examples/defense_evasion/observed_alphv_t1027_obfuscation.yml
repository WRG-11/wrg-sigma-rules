title: ALPHV/BlackCat -- T1027
id: c4ec65bc-6e83-589a-932e-8180abb3f7e8
status: test
description: Breach intel signature for actor alphv, MITRE technique T1027. Derived from 1 observed incident(s) in the WRG
  breach catalog.
references:
- https://attack.mitre.org/techniques/T1027/
- https://attack.mitre.org/software/S1068/
- https://www.mgmresorts.com/en/news/mgm-resorts-cybersecurity-issue.html
- https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-353a
author: WinstonRedGuard -- sigma plugin observed rules (derived from breach corpus)
date: '2023-09-10'
logsource:
  category: file_event
  product: windows
detection:
  selection_encoded_powershell:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -e '
  selection_long_base64_blob:
    CommandLine|re: '[A-Za-z0-9+/]{200,}={0,2}'
  # FP-fix: legit SCCM / installer / management-context PowerShell uses
  # the `-NoProfile -EncodedCommand <short payload>` combination for
  # system-context execution; the selection_* blocks above match on the
  # bare `-EncodedCommand` substring and fire on this benign pattern.
  # Tradeoff: adversaries appending `-NoProfile` to bare encoded PS
  # would evade this filter; a future refinement is to promote
  # selection_long_base64_blob (200+ char payload) to the primary
  # signal once real-world payload length distribution is characterised.
  filter_legit_sccm_installer_encoded_ps:
    CommandLine|contains: ' -NoProfile -EncodedCommand '
  condition: (selection_encoded_powershell or selection_long_base64_blob) and not filter_legit_sccm_installer_encoded_ps
falsepositives:
- Commercial installers and licensing wrappers that ship packed or obfuscated payloads
level: high
tags:
- attack.t1027
- wrg.observed.actor.alphv
- wrg.severity.high
- wrg.observed
- wrg.tactic.defense_evasion
