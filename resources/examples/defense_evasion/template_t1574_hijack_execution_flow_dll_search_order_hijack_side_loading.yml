title: Template -- Hijack Execution Flow (DLL search-order hijack / side-loading)
id: ce82f814-68e6-5d95-ab82-d716bf98759d
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1574 (Hijack Execution Flow (DLL search-order hijack / side-loading)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1574/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: image_load
  product: windows
detection:
  selection_dll_from_writable_path:
    ImageLoaded|contains:
    - \AppData\Local\Temp\
    - \Downloads\
    - \Users\Public\
    ImageLoaded|endswith: .dll
  filter_signed:
    Signed: 'true'
  condition: selection_dll_from_writable_path and not filter_signed
falsepositives:
- Installers and self-updating applications unpacking unsigned helper DLLs into a Temp directory and loading them for the duration of the install (MSI custom actions, Electron and Squirrel updaters, driver setup packages)
- Locally compiled DLLs, unsigned by construction, loaded by a debugger or test runner from a build output under a Temp or Users\Public working directory
- Sensors that never populate the Signed field, which leaves filter_signed inert and makes every load in these paths match -- confirm the field is mapped before trusting the filter to carry the rule
level: medium
tags:
- attack.t1574
- wrg.template
- wrg.tactic.defense_evasion
