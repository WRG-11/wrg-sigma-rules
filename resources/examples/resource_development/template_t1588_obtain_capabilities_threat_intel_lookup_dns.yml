title: Template -- Obtain Capabilities (threat-intel lookup DNS)
id: e794c455-fa53-5332-8cc3-8c8ad888b563
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1588 (Obtain Capabilities (threat-intel lookup DNS)). Synthetic
  exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1588/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: network_connection
  product: windows
detection:
  selection_threat_intel_lookup:
    EventID: 22
    QueryName|contains:
    - virustotal.com
    - hybrid-analysis.com
    - any.run
    - joesandbox.com
    - abuse.ch
    - crt.sh
  filter_security_tooling_host:
    Image|endswith:
    - \msedge.exe
    - \chrome.exe
    - \firefox.exe
  condition: selection_threat_intel_lookup and not filter_security_tooling_host
falsepositives:
- The security team's own enrichment tooling, which performs exactly these lookups as its normal function
- Sandbox and malware-analysis systems resolving indicators during detonation
level: medium
tags:
- attack.t1588
- wrg.template
- wrg.tactic.resource_development
