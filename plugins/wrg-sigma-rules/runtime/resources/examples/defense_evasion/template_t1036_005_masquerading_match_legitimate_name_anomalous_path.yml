title: Template -- Masquerading Match Legitimate Name (anomalous path)
id: 7f460b66-5960-575e-8c4d-8be90a222317
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1036.005 (Masquerading Match Legitimate Name (anomalous
  path)). Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1036/005/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_legit_name_anomalous_path:
    OriginalFileName:
    - svchost.exe
    - lsass.exe
    - explorer.exe
    - csrss.exe
    - winlogon.exe
    - services.exe
    - spoolsv.exe
  filter_canonical_path:
    Image|startswith:
    - C:\Windows\System32\
    - C:\Windows\SysWOW64\
  condition: selection_legit_name_anomalous_path and not filter_canonical_path
falsepositives:
- Portable applications run from a user profile or removable media by design
- Developer build output producing binaries with common system names in a project directory
- Vendor software that legitimately self-installs per-user (some chat and conferencing clients)
level: medium
tags:
- attack.t1036.005
- wrg.template
- wrg.tactic.defense_evasion
