title: Template -- RC4 Kerberos service ticket request
id: 11c9d828-e70d-5a8d-848f-f7848fca4c76
status: experimental
description: >-
  Canonical Sigma detection template for MITRE ATT&CK T1558.003 (Steal or Forge
  Kerberos Tickets: Kerberoasting). Detects a Kerberos service-ticket request
  using RC4 encryption for a non-KRBTGT service. This is a triage signal, not
  proof of Kerberoasting, because legacy service accounts can still require
  RC4. Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no
  actor binding; review and bind to your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1558/003/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-09-16'
logsource:
  service: security
  product: windows
detection:
  selection_tgs_request:
    EventID: 4769
    TicketEncryptionType: '0x17'
  filter_krbtgt:
    ServiceName|startswith: krbtgt
  condition: selection_tgs_request and not filter_krbtgt
falsepositives:
- Legacy service accounts that are intentionally configured to support RC4
- Application compatibility testing during a documented Kerberos migration
level: medium
tags:
- attack.t1558.003
- wrg.template
- wrg.tactic.credential_access
