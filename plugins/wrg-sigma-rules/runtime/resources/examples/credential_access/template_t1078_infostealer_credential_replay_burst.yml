title: Infostealer-Sourced Credential Replay Burst from Single IP -- T1078 Valid Accounts (Megalodon + TeamPCP)
id: 8596785f-eaa0-409a-8c49-fdc7a112f52d
status: experimental
description: 'Detects credential-replay-burst pattern indicative of
  infostealer-sourced stolen credentials being used in rapid succession
  across multiple victim accounts from a single source IP.

  Attack chain (Megalodon + TeamPCP):

  (1) Initial compromise via infostealer malware (RedLine, Vidar, Lumma,
  StealC) deployed on victim endpoints. Infostealer harvests browser-
  saved credentials, session cookies, MFA bypass tokens, and SSH/VPN
  config from infected hosts. Per Hudson Rock threat intel: ~33% of
  Megalodon-affected orgs had infostealer-infected employee endpoints in
  the preceding 90 days.

  (2) Harvested credentials flow to underground marketplaces (Russian
  Market, Genesis Market predecessor, Telegram bot channels) where
  TeamPCP-affiliated brokers bulk-purchase.

  (3) TeamPCP operator uses single infrastructure node (residential
  proxy, low-cost VPS) to replay credentials against the originating
  enterprise auth surface (M365, Okta, Workday, Salesforce, internal
  SSO) in rapid succession to identify still-valid credentials before
  rotation.

  (4) Composite detection signature: >10 successful authentication
  events from a single source IP across >10 distinct user accounts
  within a 1-hour window. Legitimate enterprise auth (corporate VPN
  exit, gateway, shared library) typically produces high count per ONE
  account, not many accounts.

  Optional enrichment to lower FP rate:

  - source_ip matches known infostealer C2 / broker-reseller IP list
  - user_agent matches known automated replay tooling fingerprint
  - geo-impossible-travel flag (account base location vs replay IP geo)
  - MFA challenge skip or bypass cookie reuse pattern

  Source: Megalodon profile + TeamPCP/UNC6780
  actor profile (internal)
  + Hudson Rock threat intel cited in internal cross-reference
  (internal).
  Sister cluster: observed_lapsus_t1078.yml (lapsus$ valid accounts
  pattern in initial_access; this rule extends T1078 to
  credential_access category from infostealer-fed replay angle).'
references:
  - https://attack.mitre.org/techniques/T1078/
  - https://attack.mitre.org/techniques/T1110/004/
  - https://attack.mitre.org/techniques/T1550/004/
author: WRG-11
date: 2026/05/25
tags:
  - attack.credential_access
  - attack.initial_access
  - attack.t1078
  - attack.t1110.004
  - attack.t1550.004
logsource:
  product: any
  category: authentication
detection:
  selection_successful_auth_burst:
    # SIEM aggregation:
    #   count(distinct user_principal) by src_ip > 10 per 1-hour window
    #   AND outcome == success per event
    EventType: AuthenticationSuccess
  condition: selection_successful_auth_burst
falsepositives:
  - Corporate VPN exit nodes (high count distinct users per IP; whitelist by IP-known-corporate)
  - SaaS app proxy egress IPs (whitelist by ASN-known-SaaS)
  - Shared workstations / library kiosks in enterprise environments (whitelist by IP-known-shared)
  - Federated SSO IdP outbound IPs (whitelist by IdP egress list)
level: high
