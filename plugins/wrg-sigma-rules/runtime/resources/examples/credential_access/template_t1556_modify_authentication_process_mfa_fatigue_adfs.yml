title: Template -- Modify Authentication Process (MFA fatigue / ADFS)
id: cb7a28a8-78f0-52c6-bc9d-0bbfc44bc05b
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1556 (Modify Authentication Process (MFA fatigue / ADFS)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1556/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
correlation:
  type: event_count
  rules:
  - t1556_mfa_auth_mod_base
  group-by:
  - ObjectName
  timespan: 1m
  condition:
    gt: 3
falsepositives:
- A user on a poor connection retrying authentication repeatedly within a short window
- A misconfigured client (mail app, VPN) re-authenticating in a loop after a token expiry
level: medium
tags:
- attack.t1556
