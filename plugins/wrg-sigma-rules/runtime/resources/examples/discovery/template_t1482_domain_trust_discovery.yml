title: Template -- Domain Trust Discovery Commands
id: 549104be-f84f-4758-8de8-6043c27fdebd
status: experimental
description: >-
  Canonical Sigma detection template for MITRE ATT&CK T1482 (Domain Trust
  Discovery). Detects focused Windows commands that enumerate Active Directory
  domain-trust relationships. Synthetic exemplar from the WinstonRedGuard
  threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1482/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-09-16'
logsource:
  category: process_creation
  product: windows
detection:
  selection_nltest:
    Image|endswith: '\nltest.exe'
    CommandLine|contains: '/domain_trusts'
  selection_netdom:
    Image|endswith: '\netdom.exe'
    CommandLine|contains: ' trust '
  selection_powershell:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains: Get-ADTrust
  condition: 1 of selection_*
falsepositives:
- Domain administrators validating trust changes, migrations, or incident recovery
- Automated Active Directory inventory jobs that use the same built-in commands
level: medium
tags:
- attack.t1482
- wrg.template
- wrg.tactic.discovery
