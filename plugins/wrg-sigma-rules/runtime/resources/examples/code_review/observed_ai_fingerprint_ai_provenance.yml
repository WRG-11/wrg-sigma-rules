title: Literal AI-tool self-declaration in source code
id: 0249ba8a-1724-5477-9ad5-376ee017adad
status: experimental
description: 'Detects literal AI-tool self-declaration text embedded in a file''s comments or docstrings -- commit-trailer-style
  phrases (''Co-Authored-By: Claude'', ''Generated with Claude Code'') or plain self-declarations (''Generated by ChatGPT'')
  pasted along with generated code, or quoted as data by tooling that detects/strips such trailers. Per-hit confidence
  is high without requiring co-occurrence: a literal self-declaration is near-zero-FP by construction.


  Aggregated from 1 fingerprint hit(s) across 1 file(s). Sample paths: apps/foo/bar.py.'
references:
- https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access
author: WinstonRedGuard -- sigma plugin ai-fingerprint observed rules
date: '2026-08-04'
logsource:
  category: code_review
  product: wrg_ai_fingerprint
detection:
  selection:
    detector: ai_provenance
    evidence|contains:
    - 'provenance marker: ''co-authored-by: claude'''
  condition: selection
falsepositives:
- Tooling that quotes the marker strings as literal data (e.g. a hook that detects/strips AI trailers)
level: high
tags:
- attack.t1027
- wrg.ai_fingerprint
- wrg.detector.ai_provenance
- wrg.severity.high
- wrg.observed
- wrg.tactic.code_review
