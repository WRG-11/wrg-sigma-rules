title: Template -- Supply Chain Compromise (untrusted installer execution)
id: 002bd902-f6ee-54dc-9693-235badec6aaf
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1195 (Supply Chain Compromise (untrusted installer execution)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1195/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_unsigned_install:
    Image|contains:
    - \AppData\Local\Temp\
    - \Downloads\
    - \Installers\
    Image|endswith:
    - .exe
    - .msi
    - .dll
  filter_signed:
    Signed: 'true'
  condition: selection_unsigned_install and not filter_signed
falsepositives:
- Users installing legitimate software downloaded from a vendor site rather than an internal repository
- Developer tooling installed per-user, which is unsigned or signed by a small publisher
level: medium
tags:
- attack.t1195
- wrg.template
- wrg.tactic.initial_access
