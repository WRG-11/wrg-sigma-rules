title: SafePay -- T1133 (base)
name: safepay_t1133_remote_service_base
id: c180c8b1-04b7-5e44-beb0-04a4884f576b
status: test
description: Base event match for the SafePay T1133 external-remote-service logon
  burst correlation below -- a single non-internal RDP/remote logon, on its own, is
  not the alert.
author: WinstonRedGuard -- sigma plugin observed rules (derived from breach corpus)
date: '2025-07-03'
logsource:
  product: windows
  service: security
detection:
  selection_remote_service:
    EventID: 4624
    LogonType: 10
  filter_internal_source:
    IpAddress|startswith:
    - '10.'
    - '172.'
    - 192.168.
    - '-'
  condition: selection_remote_service and not filter_internal_source
level: informational
tags:
- attack.t1133
