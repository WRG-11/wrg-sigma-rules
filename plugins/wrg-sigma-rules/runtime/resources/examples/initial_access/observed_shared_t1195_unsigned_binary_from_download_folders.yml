logsource:
  category: process_creation
  product: windows
detection:
  selection_unsigned_install:
    Image|contains:
    - \AppData\Local\Temp\
    - \Downloads\
    - \Installers\
    Image|endswith:
    - .exe
    - .msi
    - .dll
  filter_signed:
    Signed: 'true'
  condition: selection_unsigned_install and not filter_signed
falsepositives:
- Approved vendor remote access, software supply-chain deployment, or account onboarding can
  produce the same access telemetry.
- A legitimate CI/build step installing a newly-published, unsigned open-source package from
  the same Temp/Downloads staging path
- A legitimate internally-signed installer or build artifact staged in the same Downloads/Temp
  path
- An IT-sanctioned unsigned internal tool or a portable app deployed intentionally without
  a code-signing certificate, run directly from a Downloads or Installers staging folder
level: critical
