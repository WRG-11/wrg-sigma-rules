title: ClawHavoc Claude Code Skills -- skill install/egress touchpoint (base)
name: clawhavoc_skill_install_egress_base
id: 9c850d8a-0d5a-4a30-a2a0-4ae28c284e23
status: test
description: Base event match for the ClawHavoc correlation below -- a Claude
  Code/Cursor-attributed process touching `.claude/skills/`/`SKILL.md`, on its
  own, is not the alert (an ordinary developer installing a legitimate skill
  looks identical).
author: WinstonRedGuard -- sigma plugin observed rules (derived from Docker disclosure)
date: '2026-05-24'
logsource:
  category: process_creation
  product: windows
detection:
  selection_claude_skill_install_egress:
    ParentImage|endswith:
    - \claude.exe
    - \claude-code.exe
    - \cursor.exe
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \curl.exe
    - \wget.exe
    - \node.exe
    CommandLine|contains:
    - .claude/skills/
    - .claude\skills\
    - SKILL.md
  condition: selection_claude_skill_install_egress
level: informational
tags:
- attack.t1195.002
---
title: ClawHavoc Claude Code Skills -- post-install credential scan, bulk egress, or artifact hiding (base)
name: clawhavoc_post_install_suspicious_base
id: 62efec82-2802-4237-9d48-eed1aa8fe8be
status: test
description: Base event match for the ClawHavoc correlation below -- a
  post-install process touching credential locations, egressing via a
  bulk-POST-shaped command, or hiding its own artifacts, on its own, is not
  the alert.
author: WinstonRedGuard -- sigma plugin observed rules (derived from Docker disclosure)
date: '2026-05-24'
logsource:
  category: process_creation
  product: windows
detection:
  selection_post_install_credential_scan:
    ParentImage|endswith:
    - \node.exe
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - .npmrc
    - .aws/credentials
    - .ssh/id_
    - GITHUB_TOKEN
    - NPM_TOKEN
    - AWS_ACCESS_KEY
    - 1password
    - kubeconfig
  selection_post_install_bulk_egress:
    ParentImage|endswith:
    - \claude.exe
    - \claude-code.exe
    - \node.exe
    Image|endswith:
    - \curl.exe
    - \wget.exe
    - \powershell.exe
    CommandLine|contains:
    - -X POST
    - Invoke-WebRequest
    - Invoke-RestMethod
    - POST /upload
    - POST /collect
  selection_hide_artifacts_indicator:
    ParentImage|endswith:
    - \node.exe
    - \claude.exe
    - \claude-code.exe
    CommandLine|contains:
    - touch -t
    - Set-ItemProperty -Name LastWriteTime
    - mv .claude/skills/
    - rename SKILL.md
  condition: selection_post_install_credential_scan or selection_post_install_bulk_egress or selection_hide_artifacts_indicator
level: informational
tags:
- attack.t1552.001
- attack.t1564
