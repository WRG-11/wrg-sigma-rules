date: '2026-05-18'
logsource:
  category: process_creation
  product: windows
detection:
  selection_unsigned_install:
    Image|contains:
    - \AppData\Local\Temp\
    - \Downloads\
    - \Installers\
    Image|endswith:
    - .exe
    - .msi
    - .dll
  filter_signed:
    Signed: 'true'
  condition: selection_unsigned_install and not filter_signed
falsepositives:
- A legitimate CI/build step installing a newly-published, unsigned open-source package
  from the same Temp/Downloads staging path
