logsource:
  category: process_creation
  product: windows
detection:
  selection_webshell:
    ParentImage|endswith:
    - \w3wp.exe
    - \httpd.exe
    - \nginx.exe
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \bash
    - \sh
  condition: selection_webshell
falsepositives:
- Authorized vulnerability-remediation tooling spawning a shell on a file-transfer appliance
  during a scheduled patch window
- A legitimate patch-management or vulnerability-scanning tool spawning a shell on the web-server
  host during authorized remediation work
- Scheduled web-application maintenance scripts (cache-clear, log-rotation) that spawn cmd.exe/powershell.exe
  from the IIS/Apache/Nginx worker process
- An authorized WAF, APM, or monitoring agent that spawns a diagnostic shell from the web-server
  worker process during scheduled health checks
level: high
