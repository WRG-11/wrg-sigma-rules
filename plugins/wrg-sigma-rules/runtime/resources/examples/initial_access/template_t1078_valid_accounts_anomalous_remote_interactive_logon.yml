title: Template -- Valid Accounts (anomalous remote interactive logon)
id: fc76de4b-2390-51e2-9139-9de3120d8e1e
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1078 (Valid Accounts (anomalous remote interactive logon)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1078/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: authentication
  product: windows
detection:
  selection_logon:
    EventID:
    - 4624
    - 4625
    LogonType:
    - 3
    - 10
  filter_service_accounts:
    TargetUserName|startswith: svc_
  # Filter add — sister to observed_lapsus_t1078
  # (cross-corpus backport). Authorized admin operators routinely access
  # servers via RDP (LogonType 10) for maintenance; the rule
  # previously fired on legit_rdp_logon (admin_dave / LogonType 10) in
  # a prior false-positive review. Filter requires BOTH conditions (Sigma
  # selection-shape: multi-clause within one filter block = AND).
  # Tradeoff: this is a single-event precision narrow. T1078 in the
  # wild is multi-host admin-credential reuse within a short window;
  # proper detection requires correlation (count() by account across
  # hosts over time). Phase 1b aggregation matcher (V design-prep)
  # will support that pattern; this filter is the stop-gap.
  filter_legit_admin_interactive_rdp:
    LogonType: 10
    TargetUserName|startswith: admin_
  condition: selection_logon and not filter_service_accounts and not filter_legit_admin_interactive_rdp
falsepositives:
- Administrators working a planned maintenance window outside business hours
- Staff in another timezone, or on call, whose normal hours differ from the baseline
level: medium
tags:
- attack.t1078
- wrg.template
- wrg.tactic.initial_access
