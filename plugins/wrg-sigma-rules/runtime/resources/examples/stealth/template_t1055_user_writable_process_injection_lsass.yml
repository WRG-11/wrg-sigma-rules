title: Template -- User-writable process injects into LSASS
id: 023679e7-a537-5b2c-a52b-a30f15b5990b
status: experimental
description: >-
  Canonical Sigma detection template for MITRE ATT&CK T1055 (Process
  Injection). Detects Sysmon CreateRemoteThread telemetry where a process from
  a common user-writable location creates a remote thread in LSASS. This is a
  narrow high-signal template; it requires endpoint telemetry that records
  SourceImage and TargetImage. Synthetic exemplar from the WinstonRedGuard
  threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1055/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-09-16'
logsource:
  category: create_remote_thread
  product: windows
detection:
  selection_lsass_target:
    TargetImage|endswith: '\lsass.exe'
  selection_user_writable_source:
    SourceImage|contains:
    - '\Users\'
    - '\ProgramData\'
    - '\Windows\Temp\'
  condition: selection_lsass_target and selection_user_writable_source
falsepositives:
- Endpoint security, forensic, or accessibility tooling that injects into
  LSASS and is installed in a nonstandard per-user or ProgramData location
- A controlled credential-protection compatibility test on a designated lab
  endpoint
level: high
tags:
- attack.t1055
- wrg.template
- wrg.tactic.stealth
