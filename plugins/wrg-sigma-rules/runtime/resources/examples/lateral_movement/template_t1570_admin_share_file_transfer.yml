title: Template -- Administrative-share file transfer through copy tooling
id: 08cdefb6-346c-579f-b94d-4754d4ec6c44
status: experimental
description: >-
  Canonical Sigma detection template for MITRE ATT&CK T1570 (Lateral Tool
  Transfer). Detects common copy utilities targeting an administrative SMB
  share. Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no
  actor binding; review and bind to your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1570/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-09-16'
logsource:
  category: process_creation
  product: windows
detection:
  selection_copy_tool:
    Image|endswith:
    - '\copy.exe'
    - '\xcopy.exe'
    - '\robocopy.exe'
  selection_admin_share:
    CommandLine|contains:
    - '\ADMIN$\'
    - '\C$\'
  condition: selection_copy_tool and selection_admin_share
falsepositives:
- Approved software deployment, backup, or endpoint-management distribution
- Administrator file transfer during an authorized incident response
level: medium
tags:
- attack.t1570
- wrg.template
- wrg.tactic.lateral_movement
