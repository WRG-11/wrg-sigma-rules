title: Template -- Python Scripting (interpreter spawned by shell)
id: 22af9155-9f19-5832-b16a-d080f494ea99
status: experimental
description: Canonical sigma detection template for MITRE ATT&CK T1059.006 (Python Scripting (interpreter spawned by shell)).
  Synthetic exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to your environment
  before deployment.
references:
- https://attack.mitre.org/techniques/T1059/006/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-05-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_python_shell_parent:
    Image|endswith:
    - \python.exe
    - \pythonw.exe
    - \py.exe
    ParentImage|endswith:
    - \cmd.exe
    - \powershell.exe
    - \wmic.exe
    - \rundll32.exe
    - \mshta.exe
  condition: selection_python_shell_parent
falsepositives:
- CI runners and build scripts invoking Python from a shell step
- Developer and data-science workstations, where this is the normal working pattern
- Vendor tooling that ships an embedded Python interpreter and drives it from a wrapper
level: medium
tags:
- attack.t1059.006
- wrg.template
- wrg.tactic.execution
