title: Template -- WMIC remote process creation
id: f362bd4b-6e2d-517e-88eb-3c3b6094210d
status: experimental
description: >-
  Canonical Sigma detection template for MITRE ATT&CK T1047 (Windows Management
  Instrumentation). Detects WMIC issuing a remote process-create request, a
  high-signal WMI execution pattern. Synthetic exemplar from the
  WinstonRedGuard threat-intel corpus -- no actor binding; review and bind to
  your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1047/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-09-16'
logsource:
  category: process_creation
  product: windows
detection:
  selection_wmic:
    Image|endswith: '\wmic.exe'
  selection_remote_node:
    CommandLine|contains: '/node:'
  selection_process_create:
    CommandLine|contains|all:
    - process
    - ' call create '
  condition: selection_wmic and selection_remote_node and selection_process_create
falsepositives:
- Approved systems-management, inventory, or remote-support workflows
- Legacy enterprise automation using WMIC instead of PowerShell remoting
level: high
tags:
- attack.t1047
- wrg.template
- wrg.tactic.execution
