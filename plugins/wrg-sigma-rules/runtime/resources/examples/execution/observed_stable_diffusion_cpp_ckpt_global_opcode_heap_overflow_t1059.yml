title: stable-diffusion.cpp .ckpt loader -- T1059 GLOBAL opcode missing-newline yields -1 copy length
id: 89ff8024-9450-4a88-a36d-a9c48b92bf41
status: experimental
description: |
  Vendor-disclosed detection for CVE-2026-47750 (GHSA-v37x-jwp7-mcvc,
  CVSS 7.8 HIGH), affecting stable-diffusion.cpp prior to
  master-584-0a7ae07.

  The pickle `.ckpt` parser in `src/model.cpp` -- the same file as the
  sibling `SHORT_BINUNICODE` bug
  (`observed_stable_diffusion_cpp_ckpt_sign_confusion_heap_overflow_t1059`)
  -- contains a SECOND, independent heap buffer overflow in its `GLOBAL`
  opcode handler. The parser searches for newline-delimited fields when
  processing `GLOBAL` opcode data but performs no validation that the
  expected newline is actually present. A crafted `.ckpt` file that
  OMITS the expected newline causes the field-length computation to
  produce `-1`, which is then used directly as a `memcpy` copy length --
  immediate heap corruption, with the same code-execution potential
  (depending on heap layout) as the sibling bug.

  Detection logic flags a `.ckpt` model file being loaded by a
  stable-diffusion.cpp process -- the same coarse file-event signal as
  the sibling rule, since both bugs live in the same untrusted-file-load
  code path and neither can be distinguished from host-level file-event
  logging alone.

  Aggregated from 1 first-party vendor security advisory (leejet, via
  GHSA and NVD, citing the exact source file, opcode name, and root
  cause -- disclosed alongside the sibling `SHORT_BINUNICODE` bug in the
  same advisory round), fixed in master-584-0a7ae07 (same commit as the
  sibling rule).
references:
- https://github.com/leejet/stable-diffusion.cpp/security/advisories/GHSA-v37x-jwp7-mcvc
- https://github.com/leejet/stable-diffusion.cpp/commit/0a7ae07f948eff4611968a65a22bd7c7031ad74f
- https://github.com/leejet/stable-diffusion.cpp/pull/1443
- https://attack.mitre.org/techniques/T1059/
author: WinstonRedGuard -- sigma plugin observed rules (derived from breach corpus)
date: '2026-08-11'
logsource:
  category: file_event
  product: linux
detection:
  selection_ckpt_file_loaded:
    TargetFilename|endswith: .ckpt
  selection_sd_cpp_process:
    Image|contains:
    - sd
    - stable-diffusion
  condition: selection_ckpt_file_loaded and selection_sd_cpp_process
falsepositives:
- A deployment already upgraded past master-584-0a7ae07, where the
  `GLOBAL` opcode handler validates newline presence before computing a
  field length -- a matching `.ckpt` load on a fixed build parses safely
  or rejects the malformed field cleanly
- A legitimate `.ckpt` file from a trusted source loaded during normal
  operation -- this rule cannot distinguish a malicious crafted file
  from an ordinary one by filename/extension alone, since the malicious
  byte pattern (a missing newline in a specific field position) lives
  inside the file content; the advisory's own recommended mitigation
  (prefer `.safetensors`) is the stronger control this rule cannot
  verify the absence of
- Pattern library v1 -- review for environment-specific tuning before
  deployment; this rule is IDENTICAL in shape to its sibling
  `SHORT_BINUNICODE` rule since host-level file-event logging cannot
  distinguish which specific opcode handler within the same file-load
  event is reached -- both rules exist to name each CVE individually,
  not because the detection logic differs
level: high
