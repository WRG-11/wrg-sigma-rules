title: Template -- Windows Defender real-time protection disabled through PowerShell
id: dc1cb0e4-be1d-57ac-a98b-eb4282e49387
status: experimental
description: >-
  Canonical Sigma detection template for MITRE ATT&CK T1685 (Disable or
  Modify Tools). Detects PowerShell setting the Windows
  Defender DisableRealtimeMonitoring preference to true. The command requires
  appropriate privileges and is unavailable while Tamper Protection is active,
  but it is still an important high-signal defense-impairment event. Synthetic
  exemplar from the WinstonRedGuard threat-intel corpus -- no actor binding;
  review and bind to your environment before deployment.
references:
- https://attack.mitre.org/techniques/T1685/
- https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-09-16'
logsource:
  category: process_creation
  product: windows
detection:
  selection_powershell:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  selection_preference:
    CommandLine|contains|all:
    - Set-MpPreference
    - DisableRealtimeMonitoring
  selection_disable_value:
    CommandLine|contains:
    - '$true'
    - ' 1'
  condition: selection_powershell and selection_preference and selection_disable_value
falsepositives:
- An approved Microsoft Defender troubleshooting-mode session investigating a
  compatibility or performance problem, with a matching maintenance record
- Endpoint-management automation temporarily disabling real-time protection
  for a controlled software-installation or remediation workflow
- A Defender administrator testing Tamper Protection or policy behavior in a
  designated lab or pilot endpoint
level: high
tags:
- attack.t1685
- wrg.template
- wrg.tactic.defense_impairment
