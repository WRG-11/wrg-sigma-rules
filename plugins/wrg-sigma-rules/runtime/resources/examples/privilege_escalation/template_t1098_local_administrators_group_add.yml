title: Template -- Local Administrators Group Membership Added
id: 06019512-74a7-4881-b524-0a0b51cc7a21
status: experimental
description: >-
  Detects net.exe adding an account to the local Administrators group, a
  common account-manipulation action used to grant elevated access.
references:
  - https://attack.mitre.org/techniques/T1098/
author: WinstonRedGuard -- sigma plugin canonical templates
date: '2026-09-17'
logsource:
  category: process_creation
  product: windows
detection:
  selection_net:
    Image|endswith: '\net.exe'
  selection_group_add:
    CommandLine|contains|all:
      - localgroup administrators
      - ' /add'
  condition: selection_net and selection_group_add
falsepositives:
  - Approved administrator provisioning through documented endpoint management
level: high
tags:
  - attack.t1098
  - wrg.template
  - wrg.tactic.privilege_escalation
