name: publish-image

# A release publishes the GHCR image. A manual dispatch is intentionally only
# a build-and-stdio verification: it must not receive a package-write token or
# a registry login just to test an arbitrary selected ref.
on:
  release:
    types: [published]
  workflow_dispatch:  # manual, read-only dry run against a selected ref

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/wrg-11/wrg-sigma-rules-mcp

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the MCP server image without registry credentials
        run: docker build -t "$IMAGE_NAME:dry-run" .

      - name: Smoke the built image over stdio MCP
        run: |
          python3 -m pip install --disable-pip-version-check "PyYAML>=6.0.3,<7"
          EXPECTED_FINGERPRINT="$(python3 -c "from tools.resources.coverage_resource import collect_coverage; print(collect_coverage()['corpus_sha256'])")"
          python3 scripts/mcp_stdio_smoke.py --expect-corpus-fingerprint "$EXPECTED_FINGERPRINT" -- docker run -i --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m "$IMAGE_NAME:dry-run"

  publish-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout published release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the MCP server image
        run: docker build -t "$IMAGE_NAME:${{ github.event.release.tag_name }}" -t "$IMAGE_NAME:latest" .

      # A pushed image that never actually serves MCP, or serves a different
      # corpus, is worse than no image at all. Compute the expected fingerprint
      # outside the image, then require the live resource to announce it.
      - name: Smoke the built image over stdio MCP before pushing
        run: |
          python3 -m pip install --disable-pip-version-check "PyYAML>=6.0.3,<7"
          EXPECTED_FINGERPRINT="$(python3 -c "from tools.resources.coverage_resource import collect_coverage; print(collect_coverage()['corpus_sha256'])")"
          python3 scripts/mcp_stdio_smoke.py --expect-corpus-fingerprint "$EXPECTED_FINGERPRINT" -- docker run -i --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m "$IMAGE_NAME:latest"

      - name: Push released image
        run: docker push "$IMAGE_NAME" --all-tags
