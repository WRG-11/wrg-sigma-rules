name: tests

# Runs the pytest suite (rule validation + tool integration) on every push/PR
# to main so detection-logic or tool regressions are caught in CI, not just
# locally. Companion to readme-stamp.yml.
#
# The weekly run is not redundant with push/PR. Dependencies are installed
# unpinned from requirements.txt, so a new release of pysigma, PyYAML or the
# MCP SDK can break a clone of this repo while every recorded run stays green
# -- nothing re-ran after the release. That is exactly how the mcp 2.0.0
# breakage stayed invisible: the last push predated it by four days. The cron
# bounds how long such a break can hide to one week.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly (Mon 05:23 UTC) -- ahead of readme-stamp's 06:17 slot so a
    # dependency break surfaces before the corpus-stamp job runs.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # server.py supports both SDK majors through an import shim. Claiming
        # that in a comment is not evidence -- run the suite against each, so
        # the leg that breaks names itself. The two legs differ only in this
        # one package; everything else comes from requirements.txt.
        mcp-version: ["<2", ">=2"]
        # README's "Tested environments" section named Windows and WSL2
        # Ubuntu as manually-checked, once, by a person -- not CI. Running
        # the real matrix here turns that into a claim CI proves on every
        # push instead of one that ages the moment nobody re-checks by hand.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        # The README badge says "python 3.12+". The six legs above cannot
        # prove the "+" -- they all pin 3.12, and there is no requires-python
        # anywhere in the repo to check against either. One extra leg on the
        # newest interpreter is what turns that badge into a measured claim;
        # a full cross product would double the matrix to say the same thing.
        include:
          - os: ubuntu-latest
            mcp-version: ">=2"
            python-version: "3.14"
    name: pytest (${{ matrix.os }}, py ${{ matrix.python-version }}, mcp ${{ matrix.mcp-version }})
    defaults:
      run:
        # Windows runners default `run:` to pwsh, and the steps below use
        # bash syntax (multi-line `|`, quoting). GitHub-hosted Windows
        # runners ship git-bash; pinning the shell here keeps all three OSes
        # running the identical steps instead of silently forking behavior.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Pin the MCP SDK for this matrix leg
        run: pip install "mcp${{ matrix.mcp-version }}"

      - name: Show resolved MCP SDK
        run: python -c "from importlib.metadata import version; print('mcp', version('mcp'))"

      - name: Run pytest
        run: python -m pytest -q

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest coverage

      # COVERAGE_CORE=sysmon is load-bearing: under coverage.py's default C
      # tracer, pysigma's YAML loader corrupts and the suite reports false
      # failures. See .coveragerc for the measurement behind this.
      - name: Run suite under coverage
        env:
          COVERAGE_CORE: sysmon
        run: |
          python -m coverage run -m pytest -q 2>&1 | tee coverage-run.log
          # coverage silently falls back to the default core if it cannot use
          # sysmon, which reintroduces the corruption while still looking like
          # a sysmon run. Fail loudly instead of reporting a bogus number.
          if grep -q "no-sysmon" coverage-run.log; then
            echo "::error::coverage fell back off the sysmon core; the run is not trustworthy"
            exit 1
          fi

      - name: Report coverage against the floor
        run: python -m coverage report

      - name: Report ATT&CK technique coverage against the floor
        run: python scripts/coverage_gate.py

      - name: Report fingerprint-sharing rule groups (advisory, never fails)
        run: python scripts/duplicate_rule_check.py

      # Gate, not advisory: a rule whose sidecar .sample.json no longer
      # matches its own detection: logic is a real regression (the rule
      # changed, or the sample did, and nobody re-checked the pairing) --
      # not something to note and move past. Rules with NO sample yet are
      # NOT failed here (--require-samples is not passed); the corpus is
      # still filling in sidecar coverage, and forcing every status:test
      # rule to carry one before this gate can run would block unrelated
      # PRs on backlog this job did not create. 2026-09-04: 151/212 rules
      # carry a sample, 0 currently failing -- this gate has headroom.
      - name: Verify sidecar samples still match their rule's own logic
        run: python scripts/sample_match_gate.py

  dependency-licenses:
    # Advisory, not a gate: a transitive dependency's license can change on a
    # routine bump without that being a real problem, and failing the build
    # on every such change would train everyone to ignore this job. It exists
    # so the license mix is an explicit, re-derivable fact instead of nobody
    # having looked -- measured 2026-08-03 in an isolated venv: pySigma and
    # its backend/pipeline packages are LGPL-2.1/3.0 (expected, upstream
    # SigmaHQ licensing; using them as a library does not require this
    # MIT-licensed repo to relicense), everything else is MIT/BSD/Apache.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install runtime dependencies only (isolated from dev tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-licenses

      - name: Report dependency license mix
        run: python -m piplicenses --format=markdown --with-urls

  ruff:
    # F-rules only (unused imports/names, undefined names) -- see ruff.toml's
    # own comment on why this starts narrow instead of ruff's full default set.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: python -m ruff check server.py tools/ scripts/ readme_stamp.py tests/

  bandit:
    # Complements the CodeQL default-setup scan (Security tab, weekly,
    # extended query suite) rather than replacing it: CodeQL results sit a
    # click away from a PR; this fails the PR check directly and is fast
    # enough to run on every push, catching the pattern-level issues bandit
    # is built for (shell=True, eval/exec, weak hashes, hardcoded creds)
    # before merge instead of only after, in the Security tab.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write  # required by upload-sarif below
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: python -m pip install "bandit[sarif]"

      # server.py and tools/ parse untrusted rule/log content (SECURITY.md's
      # own stated scope); scripts/ builds and runs a Docker image. scan both.
      - name: Run bandit (fails the PR check on a finding)
        run: python -m bandit -r server.py tools/ scripts/ -ll

      # Same scan, SARIF output, run unconditionally: a finding should reach
      # the Security tab whether or not it also failed the check above, and
      # `if: always()` is what keeps this step from being skipped the moment
      # the human-readable run exits non-zero.
      - name: Run bandit (SARIF for the Security tab)
        if: always()
        run: python -m bandit -r server.py tools/ scripts/ -ll -f sarif -o bandit-results.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The Dockerfile has shipped since the Glama deployment work without
      # anything ever building it, so a change to requirements.txt or
      # server.py could break the image with nothing to notice.
      - name: Build the MCP server image
        run: docker build -t wrg-sigma-rules-mcp .

      # Building is not evidence that it serves. Speak MCP to the container
      # over stdio and require it to announce the tools and resources the
      # plugin promises -- a server that starts and announces nothing would
      # pass a build check and fail this one.
      - name: Smoke the container over stdio MCP
        run: python scripts/mcp_stdio_smoke.py docker run -i --rm wrg-sigma-rules-mcp
